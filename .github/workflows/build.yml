name: Derle ve yayinla

# main dalina her gonderimde (veya Actions sekmesinden elle) calisir:
# sema testi -> analiz -> testler -> APK -> Web -> GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Telefondan yalnizca zip yuklendiyse once onu ac
      - name: Zip varsa ac
        run: |
          Z=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$Z" ]; then
            echo "Aciliyor: $Z"
            unzip -oq "$Z" -d /tmp/z
            cp -r /tmp/z/mizan/. .
          fi
          test -f pubspec.yaml || { echo "::error::Proje dosyalari bulunamadi. mizan.zip yuklendi mi?"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: SQLite kutuphanesi (testler icin)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: Platform klasorleri (android, web)
        run: flutter create . --platforms=android,web --project-name mizan --org com.mizan

      - name: Paketler
        run: flutter pub get

      - name: Veritabani kodu uretimi
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Sema testi
        run: python3 tools/verify_schema.py

      - name: Kod analizi
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Testler
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Web icin SQLite dosyalari
        run: |
          V=$(awk '/^  sqlite3:/{f=1} f && /version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock)
          echo "sqlite3 surumu: $V"
          curl -fsSL -o web/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-$V/sqlite3.wasm"
          dart compile js -O4 -o web/drift_worker.js tools/drift_worker.dart

      - name: Android NDK surumu
        run: |
          sed -i -E 's/ndkVersion = flutter\.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts || true
          grep -n "ndkVersion" android/app/build.gradle.kts || true

      - name: APK derle
        id: apk
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee apk.log

      - name: Web derle
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: APK'yi siteye ekle
        if: steps.apk.outcome == 'success'
        run: cp build/app/outputs/flutter-apk/app-release.apk build/web/mizan.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: GitHub Pages'e yayinla
        id: deploy
        uses: actions/deploy-pages@v4

      # Hatalari herkese acik "annotation" olarak yazar (Claude okuyabilsin diye)
      - name: Hata ozeti
        if: always()
        run: |
          report() {
            [ -f "$2" ] || return 0
            msg=$(grep -E "$3" "$2" | head -n 45 | cut -c1-260 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            if [ -n "$msg" ]; then echo "::error title=$1::$msg"; fi
          }
          fail=0
          if [ "${{ steps.analyze.outcome }}" = "failure" ]; then fail=1; report Analiz analyze.log "(error|warning) [-•]"; fi
          if [ "${{ steps.test.outcome }}" = "failure" ]; then fail=1; report Testler test.log "\[E\]|Expected|Actual|Error|error:|Exception|Failed"; fi
          if [ "${{ steps.apk.outcome }}" = "failure" ]; then fail=1; report APK apk.log "rror|What went wrong|FAILURE|Exception|> "; fi
          echo "analiz=${{ steps.analyze.outcome }} test=${{ steps.test.outcome }} apk=${{ steps.apk.outcome }}"
          exit $fail
